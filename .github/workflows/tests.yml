name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: php tests/run.php
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          path: tests/fixtures/app
          php-version: '8.5.12'
          fail-on: none
          sarif: psc.sarif
      - run: php -r 'exit(json_decode(file_get_contents("psc.sarif"), true)["version"] === "2.1.0" ? 0 : 1);'
